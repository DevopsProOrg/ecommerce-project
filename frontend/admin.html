<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Cloth Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --line: rgba(255,255,255,0.08);
    --text: #e5e7eb;
    --muted: #94a3b8;
    --accent: #c4a47c;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: "Jost", sans-serif;
    background:
        radial-gradient(circle at top right, rgba(196, 164, 124, 0.18), transparent 30%),
        linear-gradient(160deg, #020617, #0f172a 50%, #111827);
    color: var(--text);
}
.page { max-width: 1240px; margin: 0 auto; padding: 32px 20px 48px; }
.topbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 28px; }
.title { font-family: "Playfair Display", serif; font-size: clamp(2rem, 4vw, 3.4rem); margin: 0 0 8px; }
.muted { color: var(--muted); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn, button { border: 0; border-radius: 14px; padding: 13px 16px; font: inherit; cursor: pointer; text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, var(--accent), #e7c79e); color: #111827; font-weight: 700; }
.btn-secondary { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--line); }
.grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
.card { background: rgba(17, 24, 39, 0.92); border: 1px solid var(--line); border-radius: 24px; padding: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22); }
form { display: grid; gap: 14px; }
label { font-size: 13px; font-weight: 600; color: #cbd5e1; }
input, textarea, select { width: 100%; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: var(--text); padding: 13px 14px; font: inherit; }
textarea { min-height: 120px; resize: vertical; }
.status { min-height: 22px; font-size: 14px; }
.status.error { color: #fca5a5; }
.status.success { color: #86efac; }
.products { display: grid; gap: 16px; }
.product-row { display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,0.03); }
.product-row img { width: 96px; height: 120px; object-fit: cover; border-radius: 14px; background: #e5e7eb; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: rgba(196, 164, 124, 0.14); color: #f4d8b3; font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; }
.empty { padding: 36px; text-align: center; border: 1px dashed rgba(255,255,255,0.16); border-radius: 18px; color: var(--muted); }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
@media (max-width: 700px) { .topbar, .product-row { grid-template-columns: 1fr; } .product-row img { width: 100%; height: 220px; } }
</style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div>
            <p class="muted" style="margin:0;">Admin workspace</p>
            <h1 class="title">Catalog dashboard</h1>
            <p class="muted" id="admin-meta" style="margin:0;">Checking admin session...</p>
        </div>
        <div class="actions">
            <a class="btn btn-secondary" href="index.html">Open storefront</a>
            <button id="logout-btn" class="btn btn-primary" type="button">Logout</button>
        </div>
    </div>

    <div class="grid">
        <section class="card">
            <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:18px;">
                <div>
                    <h2 style="margin:0; font-family:'Playfair Display', serif;">Product form</h2>
                    <p class="muted" style="margin:6px 0 0;">Create or update products directly in MySQL.</p>
                </div>
                <span id="form-mode" class="pill">Create</span>
            </div>

            <form id="product-form">
                <input id="product-id" type="hidden">
                <div>
                    <label for="name">Product name</label>
                    <input id="name" required>
                </div>
                <div>
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Shirts">Shirts</option>
                        <option value="Tshirt">Tshirt</option>
                        <option value="Pants">Pants</option>
                    </select>
                </div>
                <div>
                    <label for="price">Price</label>
                    <input id="price" type="number" min="1" step="0.01" required>
                </div>
                <div>
                    <label for="stock">Stock</label>
                    <input id="stock" type="number" min="0" step="1" required>
                </div>
                <div>
                    <label for="image">Image path</label>
                    <input id="image" placeholder="assets/images/products/shirt1.jpg" required>
                </div>
                <div>
                    <label for="description">Description</label>
                    <textarea id="description" placeholder="Write a short product description"></textarea>
                </div>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <button class="btn btn-primary" id="submit-btn" type="submit">Save product</button>
                    <button class="btn btn-secondary" id="reset-btn" type="button">Reset</button>
                </div>
                <div id="status" class="status"></div>
            </form>
        </section>

        <section class="card">
            <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:18px; flex-wrap:wrap;">
                <div>
                    <h2 style="margin:0; font-family:'Playfair Display', serif;">Inventory</h2>
                    <p class="muted" style="margin:6px 0 0;">Live products from the backend database.</p>
                </div>
                <button class="btn btn-secondary" id="refresh-btn" type="button">Refresh</button>
            </div>
            <div id="products" class="products"></div>
        </section>
    </div>
</div>
<script src="js/app-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
