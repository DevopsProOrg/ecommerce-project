<!DOCTYPE html>
<html>
<head>
<title>Admin - Product Manager</title>
</head>

<body>

<h2>Add Product</h2>

<input id="name" placeholder="Product name"><br>
<input id="category" placeholder="Category"><br>
<input id="price" placeholder="Price"><br>
<input id="image" placeholder="Image path"><br>
<input id="stock" placeholder="Stock"><br>

<button onclick="addProduct()">Add Product</button>

<hr>

<h2>Product List</h2>
<div id="products"></div>

<script>

const API = "http://localhost:8888/api/products"

async function loadProducts(){

    const res = await fetch(API)
    const products = await res.json()

    let html = ""

    products.forEach(p=>{
        html += `
        <div>
            ${p.name} - ₹${p.price}
            <button onclick="deleteProduct(${p.id})">Delete</button>
        </div>
        `
    })

    document.getElementById("products").innerHTML = html
}

async function addProduct(){

    const product = {
        name: document.getElementById("name").value,
        category: document.getElementById("category").value,
        price: document.getElementById("price").value,
        image: document.getElementById("image").value,
        stock: document.getElementById("stock").value
    }

    await fetch(API,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify(product)
    })

    loadProducts()
}

async function deleteProduct(id){

    await fetch(API + "/" + id,{
        method:"DELETE"
    })

    loadProducts()
}

loadProducts()
window.open("index.html", "_blank");
</script>

</body>
</html>
