  namespace: ogfashions-lp
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: replace-with-strong-password
  SPRING_DATASOURCE_USERNAME: ecommerce_app
  SPRING_DATASOURCE_PASSWORD: replace-with-strong-app-password
