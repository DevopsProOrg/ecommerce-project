apiVersion: v1
kind: Service
metadata:
  name: ogfashions-frontend
  namespace: ogfashions
spec:
  selector:
    app: ogfashions-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogfashions-frontend
  namespace: ogfashions
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ogfashions-frontend
  template:
    metadata:
      labels:
        app: ogfashions-frontend
    spec:
      containers:
        - name: frontend
          image: your-dockerhub-or-ecr-user/ogfashions-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_UPSTREAM
              valueFrom:
                configMapKeyRef:
                  name: ogfashions-config
                  key: BACKEND_UPSTREAM
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
