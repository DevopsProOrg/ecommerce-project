apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ogfashions-ingress
  namespace: ogfashions
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: ogfashions.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ogfashions-frontend
                port:
                  number: 80
