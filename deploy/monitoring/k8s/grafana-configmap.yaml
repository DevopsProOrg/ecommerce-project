apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: ogfashions
        orgId: 1
        folder: OG Fashions
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  ogfashions-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Backend Availability",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 100 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            { "expr": "100 * avg(up{job=~\"ogfashions-.*\"})", "legendFormat": "Availability" }
          ]
        },
        {
          "type": "stat",
          "title": "Critical Alerts",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            { "expr": "sum(ALERTS{alertstate=\"firing\",severity=\"critical\"})", "legendFormat": "Critical" }
          ]
        },
        {
          "type": "stat",
          "title": "Warning Alerts",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "orange", "value": 5 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            { "expr": "sum(ALERTS{alertstate=\"firing\",severity=\"warning\"})", "legendFormat": "Warning" }
          ]
        },
        {
          "type": "stat",
          "title": "Traffic Rate",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{application=\"ogfashions-backend\"}[5m]))", "legendFormat": "Requests/sec" }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Request Rate by Status",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{application=\"ogfashions-backend\"}[5m])) by (status)", "legendFormat": "{{status}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request Latency",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=\"ogfashions-backend\"}[5m])) by (le))", "legendFormat": "p95 latency" },
            { "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{application=\"ogfashions-backend\"}[5m])) by (le))", "legendFormat": "p99 latency" }
          ]
        },
        {
          "type": "timeseries",
          "title": "JVM Heap Usage",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 13 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            { "expr": "100 * sum(jvm_memory_used_bytes{application=\"ogfashions-backend\",area=\"heap\"}) / sum(jvm_memory_max_bytes{application=\"ogfashions-backend\",area=\"heap\"})", "legendFormat": "Heap %" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Process CPU Usage",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 13 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            { "expr": "100 * process_cpu_usage{application=\"ogfashions-backend\"}", "legendFormat": "CPU %" }
          ]
        },
        {
          "type": "timeseries",
          "title": "HikariCP Connections",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 13 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "hikaricp_connections_active{application=\"ogfashions-backend\"}", "legendFormat": "Active" },
            { "expr": "hikaricp_connections_idle{application=\"ogfashions-backend\"}", "legendFormat": "Idle" }
          ]
        },
        {
          "type": "logs",
          "title": "Recent Container Logs",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 21 },
          "targets": [
            { "expr": "{namespace=~\"ogfashions.*\"}", "datasource": { "type": "loki", "uid": "loki" } }
          ]
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["ogfashions", "operations"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "title": "OG Fashions Operations Overview",
      "version": 2
    }
