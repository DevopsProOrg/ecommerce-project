apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: ogfashions
        orgId: 1
        folder: OG Fashions
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  ogfashions-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "timeseries",
          "title": "HTTP Requests",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{application=\"ogfashions-backend\"}[5m])) by (uri)", "legendFormat": "{{uri}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "JVM Memory Used",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "expr": "sum(jvm_memory_used_bytes{application=\"ogfashions-backend\"}) by (area)", "legendFormat": "{{area}}" }
          ]
        },
        {
          "type": "logs",
          "title": "Recent Container Logs",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            { "expr": "{namespace=~\"ogfashions-.*\"}", "datasource": { "type": "loki", "uid": "loki" } }
          ]
        }
      ],
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["ogfashions"],
      "templating": { "list": [] },
      "time": { "from": "now-6h", "to": "now" },
      "title": "OG Fashions Overview",
      "version": 1
    }
