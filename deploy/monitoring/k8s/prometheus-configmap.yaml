apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: ogfashions-l1
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ogfashions-backend.ogfashions-l1.svc.cluster.local:8888']
            labels:
              environment: l1

      - job_name: ogfashions-l2
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ogfashions-backend.ogfashions-l2.svc.cluster.local:8888']
            labels:
              environment: l2

      - job_name: ogfashions-l3
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ogfashions-backend.ogfashions-l3.svc.cluster.local:8888']
            labels:
              environment: l3

      - job_name: ogfashions-l6
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ogfashions-backend.ogfashions-l6.svc.cluster.local:8888']
            labels:
              environment: l6

      - job_name: ogfashions-lp
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ogfashions-backend.ogfashions-lp.svc.cluster.local:8888']
            labels:
              environment: lp
  alerts.yml: |
    groups:
      - name: ogfashions-k8s
        rules:
          - alert: OgfashionsBackendDown
            expr: up{job=~"ogfashions-.*"} == 0
            for: 2m
            labels:
              severity: critical
              service: ogfashions-backend
            annotations:
              summary: "OG Fashions backend is unreachable in {{ $labels.environment }}"
              description: "Prometheus cannot scrape the backend metrics endpoint for more than 2 minutes."
          - alert: HighJvmMemoryUsage
            expr: (sum(jvm_memory_used_bytes{application="ogfashions-backend",area="heap"}) by (job) / sum(jvm_memory_max_bytes{application="ogfashions-backend",area="heap"}) by (job)) > 0.85
            for: 10m
            labels:
              severity: warning
              service: ogfashions-backend
            annotations:
              summary: "High JVM heap usage in {{ $labels.job }}"
              description: "Backend JVM heap usage stayed above 85% for 10 minutes."
