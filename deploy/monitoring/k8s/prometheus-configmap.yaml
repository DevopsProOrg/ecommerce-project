apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: ogfashions-l1
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["ogfashions-backend.ogfashions-l1.svc.cluster.local:8888"]
      - job_name: ogfashions-l2
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["ogfashions-backend.ogfashions-l2.svc.cluster.local:8888"]
      - job_name: ogfashions-l3
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["ogfashions-backend.ogfashions-l3.svc.cluster.local:8888"]
      - job_name: ogfashions-l6
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["ogfashions-backend.ogfashions-l6.svc.cluster.local:8888"]
      - job_name: ogfashions-lp
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["ogfashions-backend.ogfashions-lp.svc.cluster.local:8888"]
