apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: ogfashions-backend
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['ogfashions-backend.ogfashions-staging.svc.cluster.local:8888']
            labels:
              environment: staging
          - targets: ['ogfashions-backend.ogfashions-production.svc.cluster.local:8888']
            labels:
              environment: production
